name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - development



jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: development

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install Dependencies
        run: npm install

      - name: Run Unit Tests
        run: npm test -- --ci --coverage

      - name: Build
        run: webpack --config webpack.config.js

      - name: Verify Build Output
        run: ls -la ./build

      - name: Run MemLab Memory Leak Tests
        run: |
          # 1. Install a simple local server to host your build folder
          npm install -g serve
          
          # 2. Start the server in the background and wait for it to be ready
          serve -s build -l 3000 &
          npx wait-on http://localhost:3000
          
          # 3. Execute MemLab against your local production build
          memlab run --scenario ./memlab-scenario.js --work-dir ./memlab-results

      - name: Upload MemLab Leak Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memlab-leak-reports
          path: ./memlab-results/
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
