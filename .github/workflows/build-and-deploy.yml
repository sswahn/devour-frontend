name: Build and Deploy to GitHub Pages

on:
  push:
    branches:
      - development

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          ref: development

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm install
      
      - name: Run Unit Tests
        run: npm test -- --ci --coverage

      - name: Build
        run: npm run build

      - name: Verify Build Output
        run: ls -la ./build

      - name: Install MemLab Dependencies
        run: npm install -g serve wait-on memlab

      - name: Run MemLab Memory Leak Tests
        run: |
          serve -s build -l 3000 &
          npx wait-on http://localhost:3000

          npx memlab run \
            --scenario ./memlab-scenario.js \
            --work-dir ./memlab-results

      - name: Publish MemLab Results to Actions Tab
        if: always()
        run: |
          echo "### 🧠 MemLab Memory Leak Detection Report" >> $GITHUB_STEP_SUMMARY

          if [ -f "./memlab-results/data/cur/leaks.txt" ]; then
            echo "\`\`\`text" >> $GITHUB_STEP_SUMMARY
            cat ./memlab-results/data/cur/leaks.txt >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ No memory leak trace files found. Your app is clean!" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload MemLab Leak Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memlab-leak-reports
          path: ./memlab-results/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          publish_branch: gh-pages
